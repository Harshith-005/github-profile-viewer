name: Application CI
on:
  push:
    branches:
      - main

jobs:
  application-check:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install node"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Install dependencies"
        run: npm ci 

      - name: "Run tests"
        run: npm test

      - name: "Build Application"
        run: npm run build

